<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="base" id="base">
            <input class="display" id="display" readonly value="0">
                
            </input>
            <div class="fileira1" id="fileira1">
                <button class="botoes excluir_tudo" id="limpar">C</button>
                <button class="botoes excluir_um " id="botoes" disabled><img src="img/delete.png" alt=""></button>
                <button class="botoes operacoes" id="botoes">%</button>
                <button class="botoes operacoes" id="botoes">÷</button>
            </div>
            <div class="fileira2" id="fileira2">
                <button class="botoes numero">7</button>
                <button class="botoes numero">8</button>
                <button class="botoes numero">9</button>
                <button class="botoes operacoes" id="botoes">x</button>
            </div>
            <div class="fileira3" id="fileira3">
                <button class="botoes numero">4</button>
                <button class="botoes numero">5</button>
                <button class="botoes numero">6</button>
                <button class="botoes operacoes" id="botoes">-</button>
            </div>
            <div class="fileira4" id="fileira4">
                <button class="botoes numero">1</button>
                <button class="botoes numero">2</button>
                <button class="botoes numero">3</button>
                <button class="botoes operacoes" id="botoes">+</button>
            </div>      
              <div class="fileira5" id="fileira5">
                <button class="botoes" id="botoes" disabled>()</button>
                <button class="botoes numero">0</button>
                <button class="botoes virgula" id="botoes">,</button>
                <button class="botoes igual" id="botoes">=</button>
            </div>   
        </section>
    </main>
     <script src="script.js"></script>
</body>
</html>
